# Пример конфига: /etc/nginx/sites-available/formoms
# Скопируйте в nano или замените содержимое файла

server {
    listen 80;
    server_name formoms-ykt.ru www.formoms-ykt.ru;

    root /var/www/formoms;
    index index.html;

    # Разрешить отображение в Telegram и MAX
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://web.max.ru";
    add_header X-Frame-Options "ALLOW-FROM https://web.max.ru";

    # Статические файлы (JS, CSS, изображения) — кэшировать
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML — без кэширования
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Картинки из uploads — кэш на сутки (^~ обязателен при наличии regex выше!)
    location ^~ /api/uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # API прокси
    location /api/ {
        client_max_body_size 10M;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA — клиентский роутинг
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
